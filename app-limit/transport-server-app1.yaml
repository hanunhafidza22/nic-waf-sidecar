apiVersion: k8s.nginx.org/v1
kind: TransportServer
metadata:
  name: app1-tls-passthrough
  namespace: default
spec:
  listener:
    name: tls-passthrough
    protocol: TLS_PASSTHROUGH
  host: app1.local
  upstreams:
  - name: app1-upstream
    service: sidecar-app1
    port: 8443
  action:
    pass: app1-upstream
