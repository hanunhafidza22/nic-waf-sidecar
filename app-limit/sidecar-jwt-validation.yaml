apiVersion: v1
kind: ConfigMap
metadata:
  name: sidecar-jwt-validation
data:
  jwt.conf: |
    #load_module modules/ngx_http_auth_jwt_module.so;

    server {
      listen 80;

      access_log /var/log/nginx/access-jwt.log;
      error_log  /var/log/nginx/error-jwt.log;

      # Semua request harus lewat JWT validation
      location / {
        proxy_pass http://127.0.0.1:8080;

        # Enable JWT validation
        auth_jwt "Keycloak JWT";
        auth_jwt_key_request /_jwks_uri;

      }

      # JWKS fetch ke Keycloak
      location = /_jwks_uri {
        proxy_pass http://10.8.160.11:8081/realms/demo/protocol/openid-connect/certs;
      }
    }
